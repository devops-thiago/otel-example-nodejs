# SonarCloud Configuration
sonar.projectKey=devops-thiago_otel-example-nodejs
sonar.organization=devops-thiago

# Project metadata
sonar.projectName=OpenTelemetry Node.js Example
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=tests

# JavaScript/Node.js specific settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**

# Test exclusions
sonar.test.exclusions=tests/**

# Source encoding
sonar.sourceEncoding=UTF-8